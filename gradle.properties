# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G

# Fabric Properties
# 与 SSC 主工程 build.gradle 实际引用的字段保持一致；
# 注意 SSC gradle.properties 中的 loom_version / fabric_api_version 等字段未被其构建引用，不要照抄。
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3

# Fabric API（SSC build.gradle 实际使用的 fabric_version）
fabric_version=0.92.3+1.20.1

# Mod Properties
mod_version=0.1.0
maven_group=net.onixary
archives_base_name=ssc-primalstinct

# SSC 本地发布产物：先在 SSC 工程执行 gradlew publishToMavenLocal 或 remapJar
ssc_version=1.10.0

# 与 SSC 对齐的编译依赖（运行时由 SSC 提供/内嵌，不重复 include）
apoli_version=2.9.2+mc.1.20.x
calio_version=1.11.2+mc.1.20.x
# cca/cloth 采用 SSC dev 实际解析与 apoli jij 的共同版本（SSC gradle.properties 钉的是旧值，
# 其依赖图冲突仲裁后实际运行 5.2.1 / 11.0.99）
cca_version=5.2.1

# SSC 运行时模组集（版本取自 SSC gradle.properties / apoli POM 与 jij）
geckolib_version=4.8.4
satin_version=1.14.0
pehkui_version=3.7.8
kanosconfig_version=0.4.1
clothconfig_version=11.0.99
basic_math_version=0.6.1
reach_version=2.4.0
player_anim_version=1.0.2-rc1+1.20
pal_version=1.8.0
aea_version=1.7.4+1.20.0
